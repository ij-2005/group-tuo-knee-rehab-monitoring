<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knee Rehab Monitoring — v1 Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1 class="app__title">Knee Rehab Monitoring System</h1>
    <p class="app__subtitle">v1 Prototype — Webcam Access - VERSION 1.0</p>

    <!-- Hidden video: holds the raw MediaStream. Never shown to the user. -->
    <video id="sourceVideo" playsinline muted></video>

    <!-- Visible canvas: square viewport. Frames are drawn here. -->
    <div class="stage">
      <canvas id="stageCanvas" width="480" height="480"></canvas>
      <div id="stageMessage" class="stage__message">Camera is off</div>
    </div>

    <div class="controls">
      <button id="openBtn" type="button" class="btn btn--primary">Open Camera</button>
      <button id="closeBtn" type="button" class="btn btn--secondary" disabled>Close Camera</button>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
